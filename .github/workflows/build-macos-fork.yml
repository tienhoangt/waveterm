name: Build macOS (Fork)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Target macOS architecture"
        required: true
        default: "arm64"
        type: choice
        options:
          - arm64
          - x64
          - both

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-15
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      MAC_NOTARIZE: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Package macOS app
        run: |
          if [ "${{ inputs.arch }}" = "both" ]; then
            task package -- --mac --arm64 --x64
          elif [ "${{ inputs.arch }}" = "x64" ]; then
            task package -- --mac --x64
          else
            task package -- --mac --arm64
          fi

      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wave-macos-${{ inputs.arch }}
          path: |
            make/*.dmg
            make/*.zip
          retention-days: 30
          if-no-files-found: error
